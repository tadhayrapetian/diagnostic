<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&family=Noto+Sans+Armenian:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#EDE9DA; --paper:#FAF8F0; --ink:#232A20; --soft:#5F6656; --line:#D6CFB8;
  --green:#4F6E48; --green-d:#3C5737; --green-l:#DCE5D2; --sand:#E2DAC4; --wheat:#F0E4C3;
  --amber:#A8863A; --amber-l:#F3E6C4; --rust:#9A5B3C; --rust-l:#F0DCCD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1E18; --paper:#242A21; --ink:#ECEBDF; --soft:#B5B9A5; --line:#454B3C;
    --green:#9DBF8E; --green-d:#B9D4AC; --green-l:#2F3B2A; --sand:#363A2E; --wheat:#43391F;
    --amber:#D9BE76; --amber-l:#433A22; --rust:#E0A07F; --rust-l:#46302A;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1E18; --paper:#242A21; --ink:#ECEBDF; --soft:#B5B9A5; --line:#454B3C;
  --green:#9DBF8E; --green-d:#B9D4AC; --green-l:#2F3B2A; --sand:#363A2E; --wheat:#43391F;
  --amber:#D9BE76; --amber-l:#433A22; --rust:#E0A07F; --rust-l:#46302A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;min-height:100%;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);
  font-family:"DM Sans","Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.hidden{display:none!important}

.btn{border:none;background:var(--green);color:var(--paper);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-l)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--rust);border:1.5px solid var(--line)}

/* Home */
.home{max-width:860px;margin:0 auto;padding:40px 20px 60px}
.home h1{font-size:clamp(34px,6vw,54px);line-height:1.05}
.home .sub{color:var(--soft);margin:10px 0 28px;max-width:560px}
.list{display:grid;gap:10px;margin-top:22px}
.item{display:flex;align-items:center;gap:16px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--green)}
.item .lv{flex:0 0 54px;height:54px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-family:"DM Serif Display",Georgia,serif;font-size:22px}
.item .who{flex:1;min-width:0}
.item .who b{display:block;font-size:18px}
.item .who span{color:var(--soft);font-size:14px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--soft)}
.storeNote{color:var(--soft);font-size:13px;margin-top:20px}

/* Editor */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 0}
.topRow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topRow .name{flex:1;min-width:180px}
.topRow .name input{width:100%;border:none;background:transparent;font-family:"DM Serif Display",Georgia,serif;font-size:26px;padding:2px 0;border-bottom:1.5px dashed transparent}
.topRow .name input:focus{outline:none;border-bottom-color:var(--green)}
.status{font-size:13px;color:var(--soft);min-width:70px}
.nav{max-width:1100px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--soft);font-size:14px;padding:6px 12px;border-radius:999px;border:1.5px solid transparent;display:flex;align-items:center;gap:6px}
.nav a .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.nav a.done .dot{background:var(--green)}
.nav a.on{border-color:var(--green);color:var(--ink)}
.main{max-width:1100px;margin:0 auto;padding:22px 20px 80px}
.sec{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:24px clamp(16px,3vw,32px);margin-bottom:18px}
.sec > h2{font-size:30px;display:flex;align-items:baseline;gap:12px}
.sec > h2 .num{color:var(--green);font-size:20px}
.intro{color:var(--soft);margin:6px 0 16px;font-size:15px}
h3{font-size:20px;margin:22px 0 10px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 16px}
.field label{display:block;font-size:13px;color:var(--soft);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green)}

.crow{display:grid;grid-template-columns:minmax(200px,1.1fr) auto minmax(180px,1fr);gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:none}
.crow .lab{font-size:15px}
.crow .lab small{display:block;color:var(--soft);font-size:12.5px}
.grp{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin:16px 0 2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:none;background:transparent;padding:6px 11px;cursor:pointer;font-size:14px;border-left:1px solid var(--line);color:var(--soft)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--paper)}
.seg button[aria-pressed="true"].v-warn{background:var(--amber);color:var(--paper)}
.seg button[aria-pressed="true"].v-bad{background:var(--rust);color:var(--paper)}
.seg button[aria-pressed="true"].v-mute{background:var(--soft);color:var(--paper)}
.crow input[type=text]{padding:6px 10px}
@media (max-width:760px){.crow{grid-template-columns:1fr}.seg{flex-wrap:wrap}}

.checks{display:grid;gap:6px}
.checks .cg{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.checks .cg:first-child{border-top:none}
.checks .cg b{font-size:14px;padding-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
@media (max-width:600px){.checks .cg{grid-template-columns:1fr}}

.cefr{display:grid;gap:12px}
.cefr .asp{display:grid;grid-template-columns:110px repeat(4,1fr);gap:8px;align-items:stretch}
.cefr .asp > b{padding-top:8px}
.cefr .opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;font-size:13.5px;line-height:1.35}
.cefr .opt em{display:block;font-style:normal;font-weight:700;font-size:13px;color:var(--green);margin-bottom:2px}
.cefr .opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-l)}
@media (max-width:760px){.cefr .asp{grid-template-columns:1fr 1fr}.cefr .asp > b{grid-column:1/-1}}

.rows{display:grid;gap:8px}
.rrow{display:grid;gap:8px;align-items:center}
.rhead{display:grid;gap:8px;font-size:13px;color:var(--soft)}
.rrow .x{border:none;background:transparent;color:var(--soft);cursor:pointer;font-size:20px;line-height:1;padding:4px 8px}
.rrow .x:hover{color:var(--rust)}
.rrow .rl{font-weight:700;color:var(--green)}
@media (max-width:760px){.rrow,.rhead{grid-template-columns:1fr!important}.rhead{display:none}}

.hint{background:var(--wheat);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:12px}
.calc{color:var(--soft);font-size:14px;margin-top:6px}
.calc b{color:var(--ink)}

.exportBar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--green-l);border-radius:14px;padding:16px 18px;margin-top:10px}
.exportBar label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
</style>
</head>
<body>

<div id="homeView" class="home">
  <h1>English Diagnostic</h1>
  <p class="sub">Run a first-lesson diagnostic. Everything saves as you go. Download the results as a PDF at the end.</p>
  <button class="btn" id="newBtn">New diagnostic</button>
  <div class="list" id="list"></div>
  <p class="storeNote" id="storeNote"></p>
</div>

<div id="editView" class="hidden">
  <div class="top">
    <div class="topRow">
      <button class="btn ghost small" id="backBtn">All students</button>
      <div class="name"><input type="text" id="nameInput" placeholder="Student name" aria-label="Student name"></div>
      <span class="status" id="status"></span>
      <button class="btn" id="pdfTop">Download PDF</button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="toast hidden" id="toast" role="status"></div>

/* ---------- Storage ---------- */
const LS_KEY="english-diagnostic-v1";
let store=null; // {kind, list(), get(id), save(doc), remove(id)}
function localStore(){
  const read=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{};}catch(e){return {};}};
  const write=o=>{try{localStorage.setItem(LS_KEY,JSON.stringify(o));return true;}catch(e){return false;}};
  return {kind:"local",
    async list(){return Object.values(read());},
    async save(d){const o=read();o[d.id]=d;if(!write(o)){const e=new Error("storage");e.code="quota_exceeded";throw e;}},
    async remove(id){const o=read();delete o[id];if(!write(o))throw new Error("storage");}};
}
function dbStore(db,id){
  const col=db.collection("data/users/"+id);
  const retry=async fn=>{try{return await fn();}catch(e){if(!e||e.code!=="unavailable")throw e;
    await new Promise(r=>setTimeout(r,300+Math.random()*700));return fn();}};
  return {kind:"db",
    async list(){const s=await retry(()=>col.get());return s.docs.filter(d=>d.exists).map(d=>d.data()).filter(Boolean);},
    async save(d){const body=JSON.parse(JSON.stringify(d));await retry(()=>col.doc(d.id).set(body));},
    async remove(id){await retry(()=>col.doc(id).delete());}};
}
async function initStore(){
  let db=null,uidv=null;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      db=await Promise.race([window.claude.use("db"),new Promise(r=>setTimeout(()=>r(null),5000))]);
      if(db){const u=await window.claude.use("user");uidv=u?await u.id():null;if(!uidv)db=null;}
    }
  }catch(e){db=null;}
  store=db?dbStore(db,uidv):localStore();
}

/* Saves run one at a time: a new save waits for the previous one to finish. */
let saveChain=Promise.resolve();
function saveNow(){
  clearTimeout(saveTimer);saveTimer=null;
  const doc=A;
  saveChain=saveChain.catch(()=>{}).then(()=>store.save(doc));
  return saveChain.then(()=>{if(A===doc)$("status").textContent="Saved";return true;},
    e=>{if(A===doc)$("status").textContent="Not saved";
      toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old diagnostics.":"Changes could not be saved.");return false;});
}
function touch(){
  A.updated=Date.now();
  $("status").textContent="Saving…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,700);
  updateDots();
}

/* ---------- Home ---------- */
async function showHome(){
  $("editView").classList.add("hidden");$("homeView").classList.remove("hidden");
  const list=$("list");list.innerHTML="";
  let items=[];
  try{items=await store.list();}catch(e){items=[];}
  items.sort((a,b)=>(b.updated||0)-(a.updated||0));
  if(!items.length){const e=document.createElement("div");e.className="empty";e.textContent="No diagnostics yet. Start one with the button above.";list.appendChild(e);}
  items.forEach(it=>{
    const row=document.createElement("div");row.style.display="flex";row.style.gap="8px";row.style.alignItems="center";
    const b=document.createElement("button");b.className="item";
    const lv=document.createElement("div");lv.className="lv";
    const ov=it.data&&it.data.lvl&&it.data.lvl[String(SKILLS.length)];
    lv.textContent=(ov&&ov.r)||"?";
    const who=document.createElement("div");who.className="who";
    const nm=document.createElement("b");nm.textContent=it.name||"Unnamed student";
    const sp=document.createElement("span");
    const dt=(it.data&&it.data.profile&&it.data.profile.date)||"";
    sp.textContent=(dt?dt+"  ·  ":"")+"edited "+new Date(it.updated||Date.now()).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
    who.append(nm,sp);b.append(lv,who);
    b.onclick=()=>openA(it);
    const del=document.createElement("button");del.className="btn danger small";del.textContent="Delete";
    del.onclick=async()=>{if(confirm("Delete the diagnostic for "+(it.name||"this student")+"?")){try{await saveChain.catch(()=>{});await store.remove(it.id);}catch(e){toast("Could not delete. Try again.");}showHome();}};
    row.append(b,del);list.appendChild(row);
  });
  $("storeNote").textContent=store.kind==="db"?"Diagnostics are saved to your account and are private to you.":"Diagnostics are saved in this browser only.";
}
$("newBtn").onclick=()=>{const a=blank();openA(a);touch();};
$("backBtn").onclick=async()=>{if(!(await saveNow())&&!confirm("Changes could not be saved. Leave anyway?"))return;showHome();};

/* ---------- Editor ---------- */
function openA(a){
  A=a;if(!A.data)A.data={};
  $("homeView").classList.add("hidden");$("editView").classList.remove("hidden");
  $("nameInput").value=A.name||"";
  $("status").textContent="Saved";
  buildEditor();window.scrollTo(0,0);
}
$("nameInput").oninput=e=>{A.name=e.target.value;touch();};
$("pdfTop").onclick=()=>exportPDF();

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function segControl(options,value,onPick,label){
  const s=el("div","seg");s.setAttribute("role","group");if(label)s.setAttribute("aria-label",label);
  options.forEach(o=>{
    const b=el("button","",o);b.type="button";
    const tone=TONE[o];if(tone)b.classList.add("v-"+tone);
    b.setAttribute("aria-pressed",value===o?"true":"false");
    b.onclick=()=>{const now=b.getAttribute("aria-pressed")==="true"?"":o;
      [...s.children].forEach(x=>x.setAttribute("aria-pressed",x.textContent===now?"true":"false"));onPick(now);};
    s.appendChild(b);
  });
  return s;
}

function renderBlock(b,host){
  if(b.title)host.appendChild(el("h3","",b.title));
  if(b.t==="fields"){
    const g=el("div","fields");const o=obj(b.key);
    b.items.forEach(([k,l,type])=>{
      const f=el("div","field");const lab=el("label","",l);const id="f_"+b.key+"_"+k;lab.htmlFor=id;
      const inp=el("input");inp.type=type||"text";inp.id=id;inp.value=o[k]||"";
      if(type==="number"){inp.min="0";inp.inputMode="numeric";}
      inp.oninput=()=>{o[k]=inp.value;touch();if(b.calc)calcAvg();};
      f.append(lab,inp);g.appendChild(f);
    });
    host.appendChild(g);
    if(b.calc){const c=el("div","calc");c.id="avgCalc";host.appendChild(c);calcAvg();}
  }
  else if(b.t==="text"){
    const f=el("div","field");f.style.marginTop="14px";const id="t_"+b.key;
    const lab=el("label","",b.label);lab.htmlFor=id;const ta=el("textarea");ta.id=id;ta.rows=3;ta.value=D()[b.key]||"";
    ta.oninput=()=>{D()[b.key]=ta.value;touch();};f.append(lab,ta);host.appendChild(f);
  }
  else if(b.t==="choice"){
    const o=obj(b.key);const wrap=el("div");
    const row=(rid,label,meta,strong)=>{
      const v=o[rid]||(o[rid]={});
      const r=el("div","crow");
      const lab=el("div","lab");const lt=el("span","",label);if(strong)lt.style.fontWeight="700";lab.appendChild(lt);
      if(meta)lab.appendChild(el("small","",meta));
      const seg=segControl(b.options,v.r||"",val=>{v.r=val;touch();},label);
      const n=el("input");n.type="text";n.placeholder=b.note||"Notes";n.value=v.n||"";n.setAttribute("aria-label",(b.note||"Notes")+": "+label);
      n.oninput=()=>{v.n=n.value;touch();};
      r.append(lab,seg,n);return r;
    };
    if(b.groups){b.groups.forEach(([gn,items],gi)=>{wrap.appendChild(el("div","grp",gn));items.forEach((it,ii)=>wrap.appendChild(row(gi+"_"+ii,it)));});}
    else b.rows.forEach((it,i)=>{const lab=typeof it==="string"?it:it.label;const meta=typeof it==="string"?"":it.meta;
      wrap.appendChild(row(String(i),lab,meta,b.strongLast&&i===b.rows.length-1));});
    host.appendChild(wrap);
  }
  else if(b.t==="checks"){
    const o=obj(b.key);const w=el("div","checks");
    b.groups.forEach(([gn,items])=>{
      const cg=el("div","cg");cg.appendChild(el("b","",gn));const pills=el("div","pills");
      items.forEach(it=>{const p=el("button","pill",it);p.type="button";p.setAttribute("aria-pressed",o[it]?"true":"false");
        p.onclick=()=>{o[it]=!o[it];if(!o[it])delete o[it];p.setAttribute("aria-pressed",o[it]?"true":"false");touch();};pills.appendChild(p);});
      cg.appendChild(pills);w.appendChild(cg);
    });
    host.appendChild(w);
  }
  else if(b.t==="cefr"){
    const o=obj(b.key);const w=el("div","cefr");
    CEFR_ASPECTS.forEach(([asp,descs],i)=>{
      const r=el("div","asp");r.appendChild(el("b","",asp));
      ["A2","B1","B2","C1"].forEach((lv,j)=>{
        const bt=el("button","opt");bt.type="button";const em=el("em","",lv);bt.append(em,document.createTextNode(descs[j]));
        bt.setAttribute("aria-pressed",o[i]===lv?"true":"false");
        bt.onclick=()=>{o[i]=o[i]===lv?"":lv;[...r.querySelectorAll(".opt")].forEach((x,k)=>x.setAttribute("aria-pressed",o[i]===["A2","B1","B2","C1"][k]?"true":"false"));touch();};
        r.appendChild(bt);
      });
      w.appendChild(r);
    });
    host.appendChild(w);
  }
  else if(b.t==="rows"){
    const a=arr(b.key);const n=b.fixed||Math.max(b.min||1,a.length);
    while(a.length<n)a.push({});
    const wrap=el("div","rows");
    const tmpl=(b.rowLabel?"90px ":"")+b.cols.map(c=>c.type==="select"?"90px":c.type==="check"?"120px":"1fr").join(" ")+(b.fixed?"":" 36px");
    const head=el("div","rhead");head.style.gridTemplateColumns=tmpl;
    if(b.rowLabel)head.appendChild(el("span"));
    b.cols.forEach(c=>head.appendChild(el("span","",c.l)));if(!b.fixed)head.appendChild(el("span"));
    wrap.appendChild(head);
    const list=el("div","rows");wrap.appendChild(list);
    const draw=()=>{
      list.innerHTML="";
      a.forEach((rv,i)=>{
        const r=el("div","rrow");r.style.gridTemplateColumns=tmpl;
        if(b.rowLabel)r.appendChild(el("span","rl",b.rowLabel(i)));
        b.cols.forEach(c=>{
          let inp;
          if(c.type==="select"){inp=el("select");c.options.forEach(op=>{const o=el("option","",op||"Type");o.value=op;inp.appendChild(o);});inp.value=rv[c.k]||"";inp.onchange=()=>{rv[c.k]=inp.value;touch();};}
          else if(c.type==="check"){const lab=el("label");lab.style.display="flex";lab.style.gap="6px";lab.style.alignItems="center";lab.style.fontSize="14px";
            const cb=el("input");cb.type="checkbox";cb.checked=!!rv[c.k];cb.onchange=()=>{rv[c.k]=cb.checked;touch();};lab.append(cb,document.createTextNode(c.l));inp=lab;}
          else{inp=el("input");inp.type="text";inp.placeholder=c.l;inp.value=rv[c.k]||"";inp.oninput=()=>{rv[c.k]=inp.value;touch();};}
          if(c.type!=="check")inp.setAttribute("aria-label",c.l+" "+(i+1));
          r.appendChild(inp);
        });
        if(!b.fixed){const x=el("button","x","×");x.type="button";x.setAttribute("aria-label","Remove row");x.onclick=()=>{a.splice(i,1);if(!a.length)a.push({});draw();touch();};r.appendChild(x);}
        list.appendChild(r);
      });
    };
    draw();
    host.appendChild(wrap);
    if(!b.fixed){const add=el("button","btn ghost small","Add row");add.type="button";add.style.marginTop="10px";add.onclick=()=>{a.push({});draw();touch();};host.appendChild(add);}
  }
  else if(b.t==="levelHint"){
    const h=el("div","hint");h.id="levelHint";host.appendChild(h);updateHint();
  }
  else if(b.t==="export"){
    const bar=el("div","exportBar");
    const btn=el("button","btn","Download PDF report");btn.onclick=()=>exportPDF();
    const lab=el("label");const cb=el("input");cb.type="checkbox";cb.id="incEmpty";cb.checked=!!A.incEmpty;
    cb.onchange=()=>{A.incEmpty=cb.checked;touch();};
    lab.append(cb,document.createTextNode("Include items left blank"));
    bar.append(btn,lab);host.appendChild(bar);
  }
}

function calcAvg(){
  const c=$("avgCalc");if(!c)return;const s=obj("s");const w=+s.words||0,n=+s.sents||0;
  c.innerHTML="";c.append("Average words per sentence: ");const b=el("b","",n?(w/n).toFixed(1):"–");c.appendChild(b);
}
function levelFromQuestions(){
  const q=obj("q");let top=-1;
  QUESTIONS.forEach((x,i)=>{const r=q[i]&&q[i].r;if(r==="Easy"||r==="OK")top=i;});
  if(top<0)return null;return {level:QUESTIONS[top][2],q:top+1};
}
function updateHint(){
  const h=$("levelHint");if(!h)return;const r=levelFromQuestions();
  h.textContent=r?("The question log suggests about "+r.level+". The last question she handled well was "+r.q+"."):"Mark answers in the question log to see a suggested level.";
}

function sectionFilled(sec){
  return sec.blocks.some(b=>{
    let v=b.key?D()[b.key]:null;if(!v)return false;
    if(typeof v==="string")return v.trim()!=="";
    if(b.key==="profile"){v=Object.assign({},v);delete v.date;}
    if(Array.isArray(v))return v.some(r=>Object.values(r).some(x=>x&&String(x).trim()));
    return Object.values(v).some(x=>x&&(typeof x!=="object"||Object.values(x).some(y=>y&&String(y).trim())));
  });
}
function updateDots(){
  SPEC.forEach(s=>{const a=document.querySelector('.nav a[data-id="'+s.id+'"]');if(a)a.classList.toggle("done",sectionFilled(s));});
  updateHint();
}

let observer=null;
function buildEditor(){
  const main=$("main"),nav=$("nav");main.innerHTML="";nav.innerHTML="";
  SPEC.forEach((s,i)=>{
    const a=el("a");a.href="#sec-"+s.id;a.dataset.id=s.id;const d=el("span","dot");a.append(d,document.createTextNode((i+1)+". "+s.title.split(":")[0]));nav.appendChild(a);
    const sec=el("section","sec");sec.id="sec-"+s.id;
    const h=el("h2");h.append(el("span","num",String(i+1)),document.createTextNode(s.title));sec.appendChild(h);
    if(s.intro)sec.appendChild(el("p","intro",s.intro));
    s.blocks.forEach(b=>renderBlock(b,sec));
    main.appendChild(sec);
  });
  updateDots();
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id.slice(4)));
    const on=document.querySelector(".nav a.on");if(on)on.scrollIntoView({block:"nearest",inline:"nearest"});}});},{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll(".sec").forEach(s=>observer.observe(s));
}

/* ---------- PDF ---------- */
async function exportPDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("The PDF tool did not load. Check your connection and reload.");return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  doc.addFileToVFS("DV.ttf",FONT_R);doc.addFont("DV.ttf","DV","normal");
  doc.addFileToVFS("DVB.ttf",FONT_B);doc.addFont("DVB.ttf","DV","bold");
  doc.setFont("DV","normal");
  const G=[79,110,72],INK=[35,42,32],SOFT=[95,102,86],CREAM=[237,233,218],LINE=[214,207,184];
  const TONEC={warn:[168,134,58],bad:[154,91,60],mute:[120,124,112]};
  const W=210,M=14,CW=W-2*M,inc=!!A.incEmpty;
  let y=M;
  const need=h=>{if(y+h>285){doc.addPage();y=M;}};
  let pH2=null,pH3=null;
  const h2=t=>{pH2=t;pH3=null;};
  const h3=t=>{pH3=t;};
  const flush=()=>{
    if(pH2){need(24);y+=4;doc.setFont("DV","bold");doc.setFontSize(13);doc.setTextColor(...G);doc.text(pH2,M,y);y+=5;pH2=null;}
    if(pH3){need(18);y+=2;doc.setFont("DV","bold");doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(pH3,M,y);y+=3;pH3=null;}
  };
  const para=(label,t)=>{if(!t||!String(t).trim()){if(!inc)return;t="–";}
    pH3=null;flush();doc.setFontSize(8.5);const lines=doc.splitTextToSize(String(t),CW);need(6+lines.length*4);
    if(label){doc.setFont("DV","bold");doc.setTextColor(...INK);doc.text(label,M,y+3);y+=5;}
    doc.setFont("DV","normal");doc.setTextColor(...INK);doc.text(lines,M,y+3);y+=lines.length*4+4;};
  const table=(head,body,opts={})=>{
    if(!body.length){pH3=null;return;}
    flush();
    doc.autoTable(Object.assign({startY:y,head:[head],body,margin:{left:M,right:M},theme:"grid",
      rowPageBreak:"avoid",styles:{font:"DV",fontSize:8,cellPadding:1.8,textColor:INK,lineColor:LINE,lineWidth:0.2,overflow:"linebreak"},
      headStyles:{fillColor:G,textColor:255,fontStyle:"bold"},
      alternateRowStyles:{fillColor:[250,248,240]},
      didParseCell:d=>{if(d.section==="body"&&opts.toneCol===d.column.index){const t=TONE[d.cell.raw];if(t&&TONEC[t])d.cell.styles.textColor=TONEC[t];else if(d.cell.raw&&d.cell.raw!=="–")d.cell.styles.textColor=G;d.cell.styles.fontStyle="bold";}
        if(opts.groupRows&&d.section==="body"&&opts.groupRows.has(d.row.index)){d.cell.styles.fillColor=CREAM;d.cell.styles.fontStyle="bold";}}
    },opts.at||{}));
    y=doc.lastAutoTable.finalY+4;
  };
  const fieldsTable=b=>{const o=D()[b.key]||{};const body=b.items.map(([k,l])=>[l,o[k]||""]).filter(r=>inc||String(r[1]).trim());
    table(["Item","Answer"],body.map(r=>[r[0],r[1]||"–"]),{at:{columnStyles:{0:{cellWidth:70,fillColor:CREAM}}}});};
  const choiceTable=b=>{
    const o=D()[b.key]||{};const body=[];const groupRows=new Set();
    const push=(rid,label,meta)=>{const v=o[rid]||{};if(!inc&&!v.r&&!(v.n&&v.n.trim()))return null;return [label+(meta?"\n"+meta:""),v.r||"–",v.n||""];};
    if(b.groups){b.groups.forEach(([gn,items],gi)=>{const rows=items.map((it,ii)=>push(gi+"_"+ii,it)).filter(Boolean);if(rows.length){groupRows.add(body.length);body.push([{content:gn,colSpan:3}]);body.push(...rows);}});}
    else b.rows.forEach((it,i)=>{const r=push(String(i),typeof it==="string"?it:it.label,typeof it==="string"?"":it.meta);if(r)body.push(r);});
    table(["Item","Result",b.note||"Notes"],body,{toneCol:1,groupRows,at:{columnStyles:{0:{cellWidth:78},1:{cellWidth:22}}}});
  };
  const renderPdfBlock=b=>{
    if(b.t==="fields"){if(b.title)h3(b.title);fieldsTable(b);
      if(b.calc){const s=D().s||{};const w=+s.words||0,n=+s.sents||0;if(n)para(null,"Average words per sentence: "+(w/n).toFixed(1));}}
    else if(b.t==="text")para(b.label,D()[b.key]);
    else if(b.t==="choice"){if(b.title)h3(b.title);choiceTable(b);}
    else if(b.t==="checks"){const o=D()[b.key]||{};if(b.title)h3(b.title);
      const body=b.groups.map(([gn,items])=>[gn,items.filter(i=>o[i]).join(", ")||"–",items.filter(i=>!o[i]).join(", ")]).filter(r=>inc||r[1]!=="–");
      table(["Function","Uses","Not heard"],body,{at:{columnStyles:{0:{cellWidth:28,fillColor:CREAM},1:{textColor:G,fontStyle:"bold"},2:{textColor:SOFT}}}});}
    else if(b.t==="cefr"){const o=D()[b.key]||{};
      const body=CEFR_ASPECTS.map(([asp,ds],i)=>{const lv=o[i];const j=["A2","B1","B2","C1"].indexOf(lv);return [asp,lv||"–",j>=0?ds[j]:""];}).filter(r=>inc||r[1]!=="–");
      table(["Aspect","Level","Descriptor"],body,{toneCol:1,at:{columnStyles:{0:{cellWidth:30},1:{cellWidth:18}}}});}
    else if(b.t==="rows"){const a=D()[b.key]||[];if(b.title)h3(b.title);
      const rows=a.map((rv,i)=>(b.rowLabel?[b.rowLabel(i)]:[]).concat(b.cols.map(c=>c.type==="check"?(rv[c.k]?"Yes":""):(rv[c.k]||""))))
        .filter(r=>inc||r.slice(b.rowLabel?1:0).some(x=>String(x).trim()));
      table((b.rowLabel?[""]:[]).concat(b.cols.map(c=>c.l)),rows,{at:b.rowLabel?{columnStyles:{0:{cellWidth:18,fillColor:CREAM,fontStyle:"bold"}}}:{}});}
  };

  /* Cover band */
  doc.setFillColor(...G);doc.rect(0,0,W,34,"F");
  doc.setTextColor(255);doc.setFont("DV","bold");doc.setFontSize(18);doc.text("Diagnostic Assessment Report",M,15);
  doc.setFont("DV","normal");doc.setFontSize(10);
  const p=D().profile||{};
  doc.text((A.name||"Unnamed student")+(p.date?"   ·   "+p.date:""),M,24);
  const ov=(D().lvl||{})[String(SKILLS.length)];
  if(ov&&ov.r){doc.setFillColor(250,248,240);doc.roundedRect(W-M-30,8,30,19,3,3,"F");doc.setTextColor(...G);doc.setFont("DV","bold");doc.setFontSize(18);doc.text(ov.r,W-M-15,20.5,{align:"center"});
    doc.setFontSize(6.5);doc.text("OVERALL",W-M-15,24.5,{align:"center"});}
  y=44;

  /* Summary first */
  const sum=SPEC.find(s=>s.id==="summary");
  h2("Summary");
  const hint=levelFromQuestions();if(hint)para(null,"Question log: last question handled well was "+hint.q+" (about "+hint.level+").");
  sum.blocks.forEach(renderPdfBlock);
  SPEC.filter(s=>s.id!=="summary").forEach((s,i)=>{h2((i+1)+". "+s.title);s.blocks.forEach(renderPdfBlock);});

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("DV","normal");doc.setFontSize(7);doc.setTextColor(...SOFT);
    doc.text((A.name||"Student")+"  ·  English diagnostic",M,292);doc.text(i+" / "+n,W-M,292,{align:"right"});}

  const fname="Diagnostic - "+((A.name||"student").replace(/[\\/:*?"<>|]+/g," ").trim()||"student")+(p.date?" - "+p.date:"")+".pdf";
  const blob=doc.output("blob");
  let dl=null;
  try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads");}catch(e){dl=null;}
  if(dl){
    try{const r=await dl.save({filename:fname,data:blob});if(!r||r.status==="saved")toast("PDF saved");return;}
    catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited"){toast("A save prompt is already open.");return;}
      if(c!=="unavailable"&&c!=="not_granted"&&c!=="capability_disabled"&&c!=="capability_removed"){toast("The PDF could not be saved here.");return;}}
  }
  try{doc.save(fname);}catch(e){toast("The PDF could not be saved here.");}
}

/* ---------- Start ---------- */
(async()=>{$("list").innerHTML='<div class="empty">Loading…</div>';await initStore();showHome();})();
</script>
